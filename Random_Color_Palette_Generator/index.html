<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Pallete Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <div class="background-decoration">
        <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    </div>
    
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-palette"></i>
                Random Color Pallete Generator
            </h1>
            <p>
                Create beautiful color combinations with real color data from the color api
            </p>
            
        </div>
        <div class="controls">
            <button class="btn" onclick="generateRandomPalette()" id="randomBtn"> <i class="fas fa-dice"></i> Random Palette</button>
            <button class="btn" onclick="generateMonochromatic()" id="monoBtn"> <i class="fas fa-layer-group"></i>Monochromatic</button>
            <button class="btn" onclick="generateComplementary()" id="compBtn"> <i class="fas fa-yin-yang"></i>Complementary</button>
            <button class="btn" onclick="generateAnalogous()" id="analogBtn"> <i class="fas fa-circle-notch"></i>Analogous</button>
        </div>
    </div>
    
</body>
</html>

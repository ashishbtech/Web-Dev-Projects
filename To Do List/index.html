<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- create a container for a todo list -->
     <div id="todo-container">
        <div id="header">
            <h1>To Do List</h1>

        </div>

        <!-- for input box -->
         <div id="todo-form">
            <input type="text" class="input-box" name="input-box" id="input-box" placeholder="Add Task">
            <!-- adding the button -->
             <button id="input-button" onclick="addTask()">Add</button>
         </div>


         <!-- for task list -->
          <h2>Task List</h2>
          <ul id="list-container"></ul>
          <hr>
          <div class="counter-container">
            <div id="task-counters">
                Completed: <span id="completed-counter">0</span>  | Uncompleted:
                <span id="uncompleted-counter">0</span>
            </div>
          </div>
     </div>
    

    <script src="script.js"></script>
</body>
</html>
